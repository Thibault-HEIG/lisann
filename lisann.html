<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casting Lisann - Trouvez votre rôle</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b0000; /* Dark Crimson */
            --accent: #d4af37;  /* Gold */
            --bg: #fdfaf6;      /* Warm Parchment */
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #5c5c5c;
            --border: #e8e2d9;
            --radius: 4px;      /* Sharp, elegant corners */
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1), 0 4px 10px -4px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
            line-height: 1.6;
            background-image: radial-gradient(#e8e2d9 1px, transparent 1px);
            background-size: 40px 40px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        header::after {
            content: "";
            display: block;
            width: 80px;
            height: 3px;
            background: var(--accent);
            margin: 25px auto 0;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
            font-family: 'Playfair Display', serif;
        }

        .subtitle-less {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-style: italic;
            font-family: 'Playfair Display', serif;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 50px 0 25px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--primary);
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            background: var(--card-bg);
            padding: 40px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }

        .skill-group {
            display: flex;
            flex-direction: column;
        }

        .skill-group label {
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .skill-group input {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 0;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .skill-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 1px var(--accent);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .filter-btn {
            padding: 12px 30px;
            border-radius: 0;
            border: 1px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-btn:hover:not(.active) {
            border-color: var(--accent);
            color: var(--primary);
        }

        .actions {
            text-align: center;
            margin-bottom: 80px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            padding: 18px 45px;
            border: none;
            border-radius: 0;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 15px 30px -10px rgba(139, 0, 0, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -10px rgba(139, 0, 0, 0.5);
            background-color: #a00000;
        }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
        }

        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .result-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.15);
            border-color: var(--accent);
        }

        .character-img {
            width: 100%;
            height: 380px; /* Taller for a playbill feel */
            object-fit: cover;
            object-position: top center; /* Focus on faces, crop bottom */
            background-color: #f1f5f9;
            filter: sepia(0.2) contrast(1.1); /* Subtle theatrical filter */
            transition: filter 0.4s;
        }

        .result-card:hover .character-img {
            filter: sepia(0) contrast(1.1);
        }

        .card-content {
            padding: 30px;
            text-align: center;
            background: white;
            z-index: 1;
        }

        .card-header {
            margin-bottom: 20px;
        }

        .character-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .match-percent {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary);
            margin-top: 5px;
        }

        .score-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .score-bar-container {
            height: 4px; /* Thin, elegant bar */
            background: #eee;
            margin: 0 auto;
            width: 100%;
        }

        .score-bar-fill {
            height: 100%;
            background: var(--accent);
            transition: width 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 60px;
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--text-muted);
        }

        /* Decorative "Seal" or "Badge" for high matches */
        .match-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--accent);
            color: white;
            padding: 10px;
            font-size: 0.6rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            z-index: 2;
        }

        @media (max-width: 640px) {
            h1 { font-size: 2.5rem; }
            .grid-inputs { padding: 20px; grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <header>
        <h1>Casting Lisann</h1>
        <p class="subtitle">Découvrez votre rôle idéal.</p>
        <p class="subtitle-less">Notez que le résultat est purement indicatif et qu'il dépend fortement du point de vue du scénariste.</p>
    </header>

    <div class="section-title">Traits de Caractère Recherchés</div>
    <div class="grid-inputs" id="character-inputs"></div>

    <div class="section-title">Vos Compétences Scéniques</div>
    <div class="grid-inputs" id="performance-inputs"></div>

    <div class="filters">
        <button class="filter-btn active" onclick="setGender('All', this)">Tous les Rôles</button>
        <button class="filter-btn" onclick="setGender('M', this)">Hommes</button>
        <button class="filter-btn" onclick="setGender('F', this)">Femmes</button>
    </div>

    <div class="actions">
        <button class="btn-primary" onclick="findBestRoles()">Trouver son rôle</button>
    </div>

    <div id="results"></div>

    <script>
        const skills = [
            { id: "liberte", label: "Liberté", type: "character" },
            { id: "energie", label: "Énergie", type: "character" },
            { id: "idealisme", label: "Idéalisme", type: "character" },
            { id: "autorite", label: "Autorité", type: "character" },
            { id: "sensibilite", label: "Sensibilité", type: "character" },
            { id: "chant", label: "Chant", type: "performance" },
            { id: "danse", label: "Danse", type: "performance" },
            { id: "theatre", label: "Théâtre", type: "performance" },
            { id: "romance", label: "Romance", type: "character" }
        ];

        const roles = [
            { name: "Enguerrand", gender: "M", photo: "Photos/Leader.png", values: [5, 7, 9, 10, 3, 5, 6, 5, 7] },
            { name: "Catherine", gender: "F", photo: "Photos/Catherine.png", values: [6, 6, 8, 9, 7, 4, 9, 7, 5] },
            { name: "Reine", gender: "F", photo: "Photos/Reine.png", values: [3, 6, 6, 9, 0, 5, 8, 6, 3] },
            { name: "Charles", gender: "M", photo: "Photos/Charles.png", values: [7, 8, 6, 1, 8, 9, 8, 8, 10] },
            { name: "Octave", gender: "M", photo: "Photos/Octave.png", values: [1, 6, 2, 4, 1, 7, 5, 7, 2] },
            { name: "Marie", gender: "F", photo: "Photos/Marie.png", values: [1, 3, 2, 7, 5, 7, 7, 4, 2] },
            { name: "Lisann", gender: "F", photo: "Photos/Lisann.png", values: [10, 2, 10, 10, 0, 10, 6, 0, 0] },
            { name: "Roi", gender: "M", photo: "Photos/Roi.png", values: [10, 4, 5, 7, 1, 8, 5, 4, 9] },
            { name: "Claire", gender: "F", photo: "Photos/Claire.png", values: [9, 9, 10, 3, 8, 7, 8, 7, 4] },
            { name: "Vincent", gender: "M", photo: "Photos/Vincent.png", values: [4, 8, 6, 6, 5, 3, 7, 10, 3] },
            { name: "Père de Claire", gender: "M", photo: "Photos/Parents.png", values: [1, 3, 2, 5, 8, 6, 5, 2, 7] },
            { name: "Mère de Claire", gender: "F", photo: "Photos/Parents.png", values: [1, 7, 2, 9, 4, 6, 5, 3, 5] },
            { name: "Chef de la garde", gender: "All", photo: "Photos/Leader.png", values: [2, 8, 2, 10, 1, 4, 6, 3, 0] },
            { name: "Disciple", gender: "All", photo: "Photos/Disciples.png", values: [6, 8, 5, 2, 4, 1, 7, 10, 4] }
        ];

        let currentGenderFilter = "All";

        // Generate inputs
        const charContainer = document.getElementById("character-inputs");
        const perfContainer = document.getElementById("performance-inputs");

        skills.forEach(skill => {
            const html = `
                <div class="skill-group">
                    <label for="${skill.id}">${skill.label}</label>
                    <input type="number" min="0" max="10" value="5" id="${skill.id}">
                </div>
            `;
            if (skill.type === "character") charContainer.innerHTML += html;
            else perfContainer.innerHTML += html;
        });

        function setGender(gender, btn) {
            currentGenderFilter = gender;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            findBestRoles();
        }

        function cosineSimilarity(a, b) {
            let dot = 0, normA = 0, normB = 0;
            for (let i = 0; i < a.length; i++) {
                dot += a[i] * b[i];
                normA += a[i] * a[i];
                normB += b[i] * b[i];
            }
            normA = Math.sqrt(normA);
            normB = Math.sqrt(normB);
            if (normA === 0 || normB === 0) return 0;
            return dot / (normA * normB);
        }

        function findBestRoles() {
            const resultsContainer = document.getElementById("results");
            resultsContainer.innerHTML = "";

            const userValues = skills.map(s => Number(document.getElementById(s.id).value));

            const perfIndices = [5, 6, 7];
            const charIndices = [0, 1, 2, 3, 4, 8];

            const filteredRoles = roles.filter(role =>
                currentGenderFilter === "All" || role.gender === currentGenderFilter || role.gender === "All"
            );

            const scores = filteredRoles.map(role => {
                let perfScoreSum = 0;
                perfIndices.forEach(idx => {
                    const u = userValues[idx];
                    const r = role.values[idx];
                    const coverage = r === 0 ? 1 : Math.min(u, r) / r;
                    perfScoreSum += coverage;
                });
                const finalPerfScore = perfScoreSum / perfIndices.length;

                const userCharVec = charIndices.map(idx => userValues[idx] - 5);
                const roleCharVec = charIndices.map(idx => role.values[idx] - 5);
                const similarity = cosineSimilarity(userCharVec, roleCharVec);
                const finalCharScore = (similarity + 1) / 2;

                const totalScore = (finalPerfScore * 0.6) + (finalCharScore * 0.4);

                return {
                    ...role,
                    score: totalScore * 100
                };
            });

            scores.sort((a, b) => b.score - a.score);

            if (scores.length === 0) {
                resultsContainer.innerHTML = '<div class="no-results">Le rideau reste fermé. Aucun rôle ne correspond.</div>';
                return;
            }

            scores.forEach(role => {
                let slug = role.name.toLowerCase()
                    .replace(/ /g, "-")
                    .replace(/[éèê]/g, "e")
                    .replace(/[àâ]/g, "a");
                
                if (role.name === "Enguerrand") slug = "enguerrand";
                else if (role.name === "Lisann") slug = "";
                else if (role.name === "Roi") slug = "le-roi";
                else if (role.name === "Reine") slug = "la-reine";
                else if (role.name === "Chef de la garde") slug = "chef-gardes";
                else if (role.name === "Père de Claire" || role.name === "Mère de Claire") slug = "parents";

                const url = `https://muxicfestival.my.canva.site/lisann-characters/${slug}`;

                resultsContainer.innerHTML += `
                    <div class="result-card" onclick="window.open('${url}', '_blank')" style="cursor: pointer;">
                        ${role.score > 85 ? '<div class="match-badge">Rôle Idéal</div>' : ''}
                        <img src="${role.photo}" alt="${role.name}" class="character-img" onerror="this.src='https://via.placeholder.com/320x480?text=${role.name}'">
                        <div class="card-content">
                            <div class="card-header">
                                <div class="score-label">Affinité Artistique</div>
                                <div class="match-percent">${Math.round(role.score)}%</div>
                                <h3 class="character-name">${role.name}</h3>
                            </div>
                            <div class="score-bar-container">
                                <div class="score-bar-fill" style="width: ${role.score}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Smooth scroll to results
            resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>

</html>
