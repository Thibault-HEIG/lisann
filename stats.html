<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisann - Statistiques</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="page.css">
    <style>
        .stats-main {
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            width: calc(100vw - 40px);
            position: relative;
            left: 50%;
            transform: translateX(-50%);
        }

        .stats-card {
            background: var(--card-bg);
            padding: 15px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
        }

        .stats-card img {
            width: 100%;
            height: auto;
            border-radius: calc(var(--radius) / 2);
        }

        @media (max-width: 768px) {
            .stats-main {
                width: calc(100vw - 30px);
            }

            .stats-card {
                padding: 10px;
            }
        }

        @media (max-width: 640px) {
            .stats-main {
                width: 100%;
                left: 0;
                transform: none;
                padding: 0 6px;
            }

            .stats-card {
                padding: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Comparaison</h1>
            <p class="subtitle">Analyse comparative des rôles</p>
        </header>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="resume.html">L'Histoire</a>
            <a href="process.html">Auditions</a>
            <a href="characters.html">Personnages</a>
            <a href="test.html">Trouver mon rôle</a>
        </nav>

        <main class="stats-main">
            <div class="stats-card">
                <img src="Photos/lisann_personnages.png" alt="Statistiques des personnages">
            </div>
        </main>
    </div>
</body>
</html>
